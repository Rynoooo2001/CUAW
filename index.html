<!doctype html>
<meta charset="utf-8">
<title>WAUC signature assets</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #fff;
         color: #1B1618; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lede { color: #6F6668; margin: 0 0 32px; font-size: 14px; }
  .item { border: 1px solid #E4DEDF; border-radius: 10px; padding: 18px 20px;
          margin-bottom: 14px; }
  .name { font-family: ui-monospace, Consolas, monospace; font-size: 13px;
          color: #17284F; font-weight: bold; margin-bottom: 12px; }
  img { display: block; max-width: 100%; }
  .ok { background: #17284F; color: #fff; padding: 14px 18px; border-radius: 10px;
        font-size: 14px; margin-bottom: 28px; }
</style>

<div class="wrap">
  <h1>WAUC email signature assets</h1>
  <p class="lede">If every image below loads, this folder is hosted correctly.</p>

  <div class="ok">
    Send this page&rsquo;s address back to Claude &mdash; it becomes the
    <code>--host</code> the signatures are built against.
  </div>

  <div class="item"><div class="name">wauc-logo.png</div>
    <img src="wauc-logo.png" width="160" alt="WAUC logo"></div>

  <div class="item"><div class="name">banner.png</div>
    <img src="banner.png" width="452" alt="Banner"></div>

  <div class="item"><div class="name">icon-phone.png &middot; icon-email.png &middot; icon-location.png &middot; icon-web.png</div>
    <img src="icon-phone.png" width="18" style="display:inline-block" alt="Phone">
    <img src="icon-email.png" width="18" style="display:inline-block" alt="Email">
    <img src="icon-location.png" width="18" style="display:inline-block" alt="Address">
    <img src="icon-web.png" width="18" style="display:inline-block" alt="Web">
  </div>
</div>
